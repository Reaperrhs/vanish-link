name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate (backend syntax + frontend build)
    runs-on: ubuntu-latest
    outputs:
      deploy_ready: ${{ steps.deploy_config.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend - install & syntax check
        run: |
          npm ci
          node --check backend/index.js
          node --check mcp-server.mjs
          for f in backend/scripts/*.js; do node --check "$f"; done

      - name: Frontend - install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The secrets context is not available in job-level if-conditions, so
      # deploy readiness is computed here as a step output instead.
      - name: Check deploy configuration
        id: deploy_config
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets found — deploy job will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not configured — deploy job will be skipped."
          fi

  deploy:
    name: Deploy over SSH
    needs: validate
    # Runs only on pushes to main and only once SSH_HOST/SSH_USER/SSH_KEY have
    # been added under Settings -> Secrets and variables -> Actions.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate.outputs.deploy_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull & rebuild via docker compose
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "${DEPLOY_PATH:-$HOME/vanish-link}"
            git pull --ff-only origin main
            docker compose up -d --build
            docker image prune -f
