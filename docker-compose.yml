version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT_BACKEND:-3000}:3000"
    environment:
      - PORT=3000
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - DATABASE_ID=${DATABASE_ID}
      - COLLECTION_ID=${COLLECTION_ID}
      - WORKSPACES_COLLECTION_ID=${WORKSPACES_COLLECTION_ID}
      - ANALYTICS_COLLECTION_ID=${ANALYTICS_COLLECTION_ID:-analytics_telemetry}
      - SHORT_URL_BASE=${SHORT_URL_BASE}
      - TRUST_PROXY=${TRUST_PROXY}
      - SWEEP_TOKEN=${SWEEP_TOKEN}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_APPWRITE_PUBLIC_ENDPOINT=${VITE_APPWRITE_PUBLIC_ENDPOINT}
        - VITE_APPWRITE_PROJECT_ID=${VITE_APPWRITE_PROJECT_ID}
        - VITE_DATABASE_ID=${VITE_DATABASE_ID}
        - VITE_COLLECTION_ID=${VITE_COLLECTION_ID}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_SHORT_URL_BASE=${VITE_SHORT_URL_BASE}
    ports:
      - "${PORT_FRONTEND:-80}:80"
    restart: always
